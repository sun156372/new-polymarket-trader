version: v7
mode: "paper"          # paper | live

polymarket:
  gamma_url: "https://gamma-api.polymarket.com"
  clob_host: "https://clob.polymarket.com"
  clob_ws: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  chain_id: 137
  # NEVER put the real key here. Placeholder only; main.py reads the env var.
  private_key: "${POLYMARKET_PRIVATE_KEY}"
  private_key_env: "POLYMARKET_PRIVATE_KEY"
  funder_env: "POLYMARKET_FUNDER"
  signature_type: 0
  live_confirm_file: "live_trading_confirm.txt"
  live_confirm_phrase: "I CONFIRM LIVE TRADING"

binance:
  ws_url: "wss://stream.binance.com:9443/ws/btcusdt@bookTicker"

# Official-synced local fallback source.  Polymarket's BTC 5m markets settle
# against Chainlink's 30s BTC/USD TWAP; this RTDS topic is the same feed.
# If no TWAP is available, the position stays PENDING/unresolved rather than
# falling back to Binance's instantaneous price.
chainlink_twap:
  enabled: true
  ws_url: "wss://ws-live-data.polymarket.com"
  # PolyBolt channel name. The old `prices.crypto.chainlink.twap` topic is
  # retired; the subscription frame is op/channel/filter (see twap_feed.py).
  topic: "price.crypto.twap"
  # PolyBolt canonical crypto symbol: USD pair without separators.
  symbol: "btcusd"
  window_seconds: 30
  stale_after_s: 120
  open_tolerance_s: 60
  close_tolerance_s: 45

strategy:
  entry_t_minus_s: 240
  move_threshold: 0.20
  mode: follow
  imbalance_depth: 10
  min_book_imbalance: 0.30
  min_spot_move: 0.00020   # 2.0 bps
  max_entry_price: 0.95
  max_quote_staleness_s: 2.0
  # Absolute dead-book gate; missing/NA/stale data never reaches an order.
  hard_max_quote_staleness_s: 60.0
  # Paper fills consume visible ask levels, then add this adverse slippage.
  max_slippage_cents: 2.0

  # Print one detailed final-window block per market.
  debug: true

exit:
  enable_take_profit: false
  take_profit_bid_price: 0.98
  fallback: hold_to_settlement

resolution:
  # Short grace period after close before the first strict Gamma poll.
  start_buffer_s: 5
  # Bounded polling; never spin the Gamma API once per main-loop tick.
  poll_interval_s: 5
  # Layer 2/3 fallback becomes eligible 60s after close.
  fallback_after_s: 60
  # Terminal breaker: always settle (or force LOSS) by 180s.
  hard_timeout_s: 180

costs:
  fee_model: "0.07 * p * (1-p)"
  fee_coefficient: 0.07
  fee_side: taker_only

risk:
  stake_usdc: 10.0
  starting_balance_usdc: 1000.0
  max_concurrent_positions: 2
  daily_max_loss_usdc: 30.0
  max_trades_per_day: 40

state:
  path: "data/state.json"
  lock_path: "data/state.json.lock"
  backup_corrupt: true

redeem:
  enabled: true
  interval_s: 60
  finality_buffer_s: 30
  chain_id: 137
  rpc_url_env: "POLYGON_RPC_URL"
  private_key_env: "POLYMARKET_PRIVATE_KEY"
  conditional_tokens: "0x4D97DCd97eC945f40cF65F87097ACe5EA0476045"
  collateral_usdc: "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174"
  gas_multiplier: 1.25
  receipt_timeout_s: 180
  max_attempts_before_alert: 5

analytics:
  heartbeat_s: 60
  log_path: "logs/v7.log"
  print_interval_s: 60
